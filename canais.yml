name: Atualizar canais
on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
concurrency:
  group: atualizar-dados
permissions:
  contents: write
jobs:
  canais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python canais.py
      - name: Gravar alterações
        run: |
          git config user.name "canais-bot"
          git config user.email "canais-bot@users.noreply.github.com"
          git add canais.json
          git diff --cached --quiet || (git commit -m "Atualizar canais" && git pull --rebase && git push)
