name: Atualizar fotos
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizar-dados
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python fotos.py
      - name: Gravar alterações
        run: |
          git config user.name "dados-bot"
          git config user.email "dados-bot@users.noreply.github.com"
          git add data/fotos.json
          git diff --cached --quiet || (git commit -m "Atualizar fotos" && git pull --rebase && git push)
