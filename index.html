<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Futebol</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futebol">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f6b4a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚽%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#14212b;--mute:#5d6b76;--line:#d9e0e5;--live:#d6342c;--acc:#0f6b4a;--onacc:#fff}
[data-mode=d]{--bg:#0e1519;--card:#16212a;--ink:#e8eef2;--mute:#8fa0ab;--line:#26343e;--live:#ff6b5e}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
h1 small{font-size:12px;font-weight:500;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font:600 13px system-ui;display:flex;align-items:center}
.chip.on,.seg.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
main{padding:12px 14px;max-width:640px;margin:auto}
.ll{width:18px;height:18px;object-fit:contain;margin-right:6px}
.day,.sub{font-weight:700;font-size:14px;color:var(--mute);margin:16px 0 6px;text-transform:capitalize}
.lg{font-weight:700;font-size:13px;color:var(--acc);margin:12px 0 4px;display:flex;align-items:center}
.lg .ll{width:22px;height:22px}
.back{border:0;background:none;color:var(--acc);font:600 14px system-ui;padding:4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--ink);font:inherit}
.tile img{width:30px;height:30px;object-fit:contain}
.tile b{display:block;margin-top:6px;font-size:14px}
.tile small{color:var(--mute);font-size:12px}
.tile small i{color:var(--live);font-style:normal;font-weight:700}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:2px 0}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t img{width:22px;height:22px;object-fit:contain;flex:none}
.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800;font-variant-numeric:tabular-nums}
.st{font-size:12px;color:var(--mute)}
.st.live{color:var(--live);font-weight:700}
.ctr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.ctr .t:first-child{justify-content:flex-end}
.ctr .mid{min-width:54px}
.big{text-align:center;padding:14px}
.big .g{display:flex;justify-content:space-around;align-items:center;margin:8px 0}
.big img{width:46px;height:46px;object-fit:contain;display:block;margin:auto}
.big .mid{font-size:26px;font-weight:800}
.board{background:#0b0f0d;border-color:#1f2b24;color:#e8efe9}
.board .sc{font:800 24px ui-monospace,monospace;color:#5eea9a}
.board .st{color:#ffb347}
.tl{position:relative}
.ti{display:grid;grid-template-columns:42px 14px 1fr;gap:6px}
.ti .h{font-size:13px;color:var(--mute);padding-top:12px}
.ti .d{position:relative}
.ti .d:before{content:"";position:absolute;left:6px;top:0;bottom:-8px;width:1px;background:var(--line)}
.ti .d:after{content:"";position:absolute;left:1px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--acc)}
.ti.lv .d:after{background:var(--live)}
.strip{display:flex;gap:6px;margin-bottom:10px}
.dd{flex:1;text-align:center;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 12px system-ui}
.dd b{display:block;font-size:16px}
.dd.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.hero{background:var(--acc);color:var(--onacc);border-radius:14px;padding:14px;text-align:center;margin-bottom:6px;cursor:pointer}
.hero .g{display:flex;justify-content:space-around;align-items:center;margin:10px 0}
.hero img{width:44px;height:44px;object-fit:contain}
.car{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.car .m{flex:none;width:130px;text-align:center;margin:0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:7px 6px;text-align:center;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line)}
td.n{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.p{font-weight:800}
tr+tr td{border-top:1px solid var(--line)}
.news{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px;text-decoration:none;color:inherit}
.news img{width:96px;object-fit:cover;flex:none;background:var(--line)}
.news div{padding:10px 10px 10px 12px}
.news b{display:block;font-size:15px;line-height:1.3}
.news small{color:var(--mute);font-size:12px}
.ph{width:96px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--line)}
.ph .ll{width:40px;height:40px;margin:0}
.hint{color:var(--mute);font-size:13px;margin:0 0 8px}
.msg{color:var(--mute);text-align:center;padding:28px 10px}
.set h3{font-size:15px;margin:18px 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;margin-bottom:6px;font:600 14px system-ui}
.opt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.segs{display:flex;gap:6px}
.seg{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 0;font:600 14px system-ui}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--bg);outline:1px solid var(--line)}
.sw button.on{outline:3px solid var(--ink)}
.set input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px system-ui}
.set .rs{margin-top:20px;border:1px solid var(--line);background:none;color:var(--mute);border-radius:12px;padding:10px 14px;font:600 14px system-ui}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .p{background:var(--bg);width:100%;max-width:640px;margin:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.dh button{border:0;background:var(--card);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:16px}
.dt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin:14px 0}
.dt img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 4px}
.dt .mid{font-size:30px;font-weight:800}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.box h4{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:8px}
.ch{display:inline-block;background:var(--acc);color:var(--onacc);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;margin:0 6px 6px 0}
.ch.f{background:var(--line);color:var(--ink)}
.box a{color:var(--acc);font-weight:600;text-decoration:none}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 11px system-ui;padding:12px 0}
nav button.on{color:var(--acc);box-shadow:inset 0 2px var(--acc)}
.m.fv{border-left:3px solid var(--acc)}
tr[data-club]{cursor:pointer}
.pitch{background:#1c6b45;border-radius:12px;padding:10px 6px;margin-top:8px;color:#fff}
.pitch h5{font-size:13px;margin:0 0 6px 6px}
.pl{display:flex;justify-content:space-around;margin:9px 0}
.pl span{flex:1;text-align:center;font-size:11px;line-height:1.2;padding:0 2px}
.pl b{display:block;font-size:12px}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--ink);font:inherit;text-align:center}
.cv img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:6px;background:var(--line);display:block}
.cv small{display:block;margin-top:6px;font-weight:600}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:none;overflow:auto}
#lb.on{display:block}
#lb img{width:100%;display:block;margin:auto}
#lb img.z{width:250%;max-width:none}
#lbx{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:31;width:38px;height:38px;border-radius:50%;border:0;font-size:18px}
.vc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vc button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 10px;font:600 12px system-ui}
.tabs{display:flex;gap:6px;margin:12px 0}
.set input.k{font-size:14px}
.set p{color:var(--mute);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Futebol <small id="upd"></small></h1>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><p class="msg">A carregar…</p></main>
<div id="sheet"><div class="p" id="sp"></div></div>
<nav>
  <button data-t="jogos" class="on">Jogos</button>
  <button data-t="tabelas">Tabelas</button>
  <button data-t="noticias">Notícias</button>
  <button data-t="resumos">Resumos</button>
  <button data-t="defs">Definições</button>
</nav>
<div id="lb"><button id="lbx" aria-label="Fechar">✕</button><img id="lbi" alt=""></div>
<script>
const LEAGUES=[
 {id:'por.1',lg:14,name:'Liga Portugal',q:'Benfica OR Sporting OR FC Porto OR Braga'},
 {id:'eng.1',lg:23,name:'Premier League',q:'Premier League'},
 {id:'eng.2',lg:24,name:'Championship',q:'EFL Championship'},
 {id:'esp.1',lg:15,name:'La Liga',q:'La Liga'},
 {id:'ita.1',lg:12,name:'Serie A',q:'Serie A'},
 {id:'ger.1',lg:10,name:'Bundesliga',q:'Bundesliga'},
 {id:'fra.1',lg:9,name:'Ligue 1',q:'Ligue 1'}
];
const SITES=['abola.pt','record.pt','ojogo.pt','rtp.pt','maisfutebol.iol.pt'];
const DIAS=4;
// Canais em Portugal por liga (edita aqui se os direitos mudarem).
const CANAIS_PT={'por.1':['Sport TV'],'eng.1':['DAZN'],'eng.2':['Sport TV'],'esp.1':['DAZN'],'ita.1':['Sport TV'],'ger.1':['DAZN'],'fra.1':['Sport TV']};
const CAPAS=[['A Bola','pt','abola'],['Record','pt','record'],['O Jogo','pt','ojogo'],['Marca','es','marca'],['AS','es','as'],['Mundo Deportivo','es','mundo_deportivo'],['Gazzetta dello Sport','it','gazzetta_sport'],['L’Équipe','fr','lequipe']];
const LAY={
 p:{n:'Principal: grelha de ligas e linha do tempo',h:'gridtl',c:'center'},
 1:{n:'LiveScore escuro',h:'list',c:'row',mode:'escuro',acc:'amarelo'},
 2:{n:'Claro e arredondado',h:'strip',c:'center',mode:'claro'},
 3:{n:'Cartões grandes',h:'list',c:'big'},
 4:{n:'Direto em primeiro',h:'live',c:'row'},
 5:{n:'A minha equipa primeiro',h:'hero',c:'row'},
 6:{n:'Linha do tempo',h:'tl',c:'row'},
 7:{n:'Grelha de ligas',h:'grid',c:'center'},
 8:{n:'Semana em calendário',h:'strip',c:'row'},
 9:{n:'Placar de estádio',h:'list',c:'board',mode:'escuro',acc:'verde'},
 10:{n:'Feed misto',h:'feed',c:'center'}
};
const ACC={verde:['#0f6b4a','#3dbd8d'],azul:['#1d5fd1','#6aa3ff'],laranja:['#d4570f','#ff9a5c'],roxo:['#6b3fd1','#a98bff'],vermelho:['#c62828','#ff7a72'],amarelo:['#a87800','#ffd400']};
const ESPN='https://site.api.espn.com/apis/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={lay:'p',mode:'auto',acc:'verde',favs:[{name:'Sporting CP',full:'Sporting CP',lg:'por.1'}],yt:''};
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem('fut')||'{}')}}catch{}
const save=()=>{try{localStorage.setItem('fut',JSON.stringify(S))}catch{}};
let ss='',addLg='',nsub='n',PAST=[],pastDone=false,tab='jogos',lg='all',cache={},DATA=null,dayI=0,failed=false;
const LG=l=>`<img class="ll" src="https://a.espncdn.com/i/leaguelogos/soccer/500/${l.lg}.png" alt="" onerror="this.style.display='none'">`;
const hm=d=>d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
const dayLbl=d=>d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const sel=()=>lg==='all'?LEAGUES:LEAGUES.filter(l=>l.id===lg);

function theme(){
  const dark=S.mode==='escuro'||(S.mode==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  const r=document.documentElement;r.dataset.mode=dark?'d':'l';
  r.style.setProperty('--acc',ACC[S.acc][dark?1:0]);
  r.style.setProperty('--onacc',dark?'#06160f':'#fff');
  document.querySelector('meta[name=theme-color]').content=dark?'#0e1519':ACC[S.acc][0];
}
function chips(){
  const all=[{id:'all',name:'Todas'},...LEAGUES];
  $('#chips').innerHTML=all.map(l=>`<button class="chip ${l.id===lg?'on':''}" data-l="${l.id}">${l.lg?LG(l):''}${l.name}</button>`).join('');
  const hide=tab==='defs'||(tab==='jogos'&&['grid','gridtl'].includes(LAY[S.lay].h));
  $('#chips').style.display=hide?'none':'flex';
}
$('#chips').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;lg=b.dataset.l;chips();render()};
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));chips();render()};

async function fetchDays(offs){
  const days=offs.map(i=>{const d=new Date();d.setDate(d.getDate()+i);return ymd(d)});
  let f=0,t=0;
  const res=await Promise.all(LEAGUES.flatMap(l=>days.map(async dd=>{t++;
    try{const d=await j(`${ESPN}site/v2/sports/soccer/${l.id}/scoreboard?dates=${dd}`);return (d.events||[]).map(e=>({l,e}))}catch{f++;return []}})));
  return {ev:res.flat(),bad:f===t};
}
async function load(){
  const c=await fetchDays([0,1,2,3]);
  if(!pastDone){pastDone=true;PAST=(await fetchDays([-1,-2,-3,-4,-5,-6,-7])).ev}
  const seen=new Set();
  DATA=[...PAST,...c.ev].filter(x=>!seen.has(x.e.id)&&seen.add(x.e.id)).sort((a,b)=>new Date(a.e.date)-new Date(b.e.date));
  failed=c.bad;
  if(tab==='jogos'||tab==='resumos')render();
}
const favM=x=>S.favs.some(f=>cp(x).some(y=>y.team.displayName.toLowerCase().includes(f.name.toLowerCase())));
const isLive=x=>x.e.status.type.state==='in';
const cp=x=>{const c=x.e.competitions[0].competitors;return[c.find(y=>y.homeAway==='home')||c[0],c.find(y=>y.homeAway==='away')||c[1]]};
const stTxt=x=>{const st=x.e.status.type,d=new Date(x.e.date);return st.state==='pre'?hm(d):st.state==='in'?'● '+st.shortDetail:st.shortDetail};
const im=t=>`<img src="${esc(t.team.logo||'')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;

function card(x,style){
  const [h,w]=cp(x),pre=x.e.status.type.state==='pre',L=isLive(x),sc=y=>pre?'':esc(y.score);
  const st=`<div class="st ${L?'live':''}">${esc(stTxt(x))}</div>`;
  if(style==='big')return `<div class="m big ${favM(x)?'fv':''}" data-id="${x.e.id}">${st}<div class="g"><div>${im(h)}<div>${esc(h.team.shortDisplayName||h.team.displayName)}</div></div><div class="mid">${pre?'vs':sc(h)+' : '+sc(w)}</div><div>${im(w)}<div>${esc(w.team.shortDisplayName||w.team.displayName)}</div></div></div></div>`;
  if(style==='center')return `<div class="m ${favM(x)?'fv':''}" data-id="${x.e.id}"><div class="ctr"><div class="t"><span>${esc(h.team.displayName)}</span>${im(h)}</div><div class="mid"><div class="sc">${pre?hm(new Date(x.e.date)):sc(h)+' - '+sc(w)}</div>${pre?'':st}</div><div class="t">${im(w)}<span>${esc(w.team.displayName)}</span></div></div></div>`;
  const row=y=>`<div class="row"><div class="t">${im(y)}<span>${esc(y.team.displayName)}</span></div><div class="sc">${sc(y)}</div></div>`;
  return `<div class="m ${style==='board'?'board':''} ${favM(x)?'fv':''}" data-id="${x.e.id}">${row(h)}${row(w)}<div style="margin-top:4px">${st}</div></div>`;
}
const grouped=(ev,style)=>{
  let out='',cur='',cl='';
  for(const x of ev){const d=new Date(x.e.date),k=d.toDateString();
    if(k!==cur){cur=k;cl='';out+=`<div class="day">${esc(dayLbl(d))}</div>`}
    if(x.l.id!==cl){cl=x.l.id;out+=`<div class="lg">${LG(x.l)}${esc(x.l.name)}</div>`}
    out+=card(x,style)}
  return out};
const timeline=(ev,style)=>{
  let out='',cur='';
  for(const x of ev){const d=new Date(x.e.date),k=d.toDateString();
    if(k!==cur){cur=k;out+=`<div class="day">${esc(dayLbl(d))}</div>`}
    out+=`<div class="ti ${isLive(x)?'lv':''}"><div class="h">${isLive(x)?'<b style="color:var(--live)">Direto</b>':hm(d)}</div><div class="d"></div><div><div class="st" style="margin:0 0 3px">${LG(x.l)}${esc(x.l.name)}</div>${card(x,style==='board'||style==='big'?'row':style)}</div></div>`}
  return out};

function jogos(){
  if(DATA===null)return '<p class="msg">A carregar…</p>';
  if(failed)return '<p class="msg">Não foi possível obter os jogos (a fonte não respondeu). Volta a tentar daqui a pouco.</p>';
  const t0=new Date().setHours(0,0,0,0),UP=DATA.filter(x=>new Date(x.e.date)>=t0),Ly=LAY[S.lay],h=Ly.h,c=Ly.c,all=UP.filter(x=>lg==='all'||x.l.id===lg);
  const today=new Date().toDateString(),tod=UP.filter(x=>new Date(x.e.date).toDateString()===today);
  const none='<p class="msg">Sem jogos para esta seleção.</p>';
  if(h==='grid'||h==='gridtl'){
    if(lg!=='all'){const ev=UP.filter(x=>x.l.id===lg);
      return `<button class="back" data-l="all">← Todas as ligas</button><div class="lg">${LG(LEAGUES.find(l=>l.id===lg))}${esc(LEAGUES.find(l=>l.id===lg).name)}</div>`+(ev.length?(h==='grid'?grouped(ev,c):timeline(ev,c)):none)}
    const tiles=`<div class="tiles">${LEAGUES.map(l=>{const n=tod.filter(x=>x.l.id===l.id).length,v=tod.filter(x=>x.l.id===l.id&&isLive(x)).length;

async function noticias(){

  if(tab==='noticias'&&nsub==='c'){$('#main').innerHTML=sw+capas();return}
  const key=tab+lg;
  if(cache[key]&&!force)$('#main').innerHTML=sw+cache[key];else $('#main').innerHTML=sw+'<p class="msg">A carregar…</p>';
  try{const h=await (tab==='tabelas'?tabelas:noticias)();cache[key]=h;if(my===tok){$('#main').innerHTML=sw+h;$('#upd').textContent='Atualizado '+hm(new Date())}}
  catch{if(my===tok)$('#main').innerHTML=sw+'<p class="msg">Sem ligação. Verifica a internet e volta a abrir.</p>'}
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
theme();chips();render();load();
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){cache={};load();if(tab==='tabelas'||tab==='noticias')render(true)}});
</script>
</body>
</html>
